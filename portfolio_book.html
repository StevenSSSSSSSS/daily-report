<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xAI Grok 4.3 Portfolio Book</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 24px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e5edf7;
    }

    /* ---- header bar ---- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #17263a;
      border: 1px solid #34465e;
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    .header-title {
      font-size: 22px;
      font-weight: 200;
      color: #f4f7fb;
      margin-bottom: 4px;
    }

    .header-date {
      font-size: 13px;
      color: #9caec4;
    }

    .header-right {
      text-align: right;
    }

    .header-label {
      font-size: 11px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .header-update {
      font-size: 13px;
      color: #00c896;
    }

    .section {
      background: #17263a;
      border: 1px solid #34465e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    .section h2 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1.0px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f4f7fb;
    }

    .section h2 .badge {
      font-size: 12px;
      font-weight: 100;
      letter-spacing: 1.0px;
      padding: 2px 8px;
      border-radius: 6px;
      background: #0d1b2d;
      color: #9caec4;
      border: 1px solid #2b3d55;
    }

    /* ---- summary cards ---- */
    .summary-cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      min-width: 140px;
      background: #102034;
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .card .label {
      font-size: 12px;
      color: #9caec4;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card .value {
      font-size: 22px;
      font-weight: 700;
      color: #f4f7fb;
    }

    .card .sub {
      font-size: 13px;
      color: #9caec4;
      margin-top: 2px;
    }

    /* ---- table ---- */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 760px;
    }

    th, td {
      border: 1px solid #27394f;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .portfolio-table th:nth-child(2),
    .portfolio-table th:nth-child(3),
    .portfolio-table th:nth-child(4),
    .portfolio-table th:nth-child(5),
    .portfolio-table th:nth-child(6),
    #posRows tr td:nth-child(2),
    #posRows tr td:nth-child(3),
    #posRows tr td:nth-child(4),
    #posRows tr td:nth-child(5),
    #posRows tr td:nth-child(6),
    .trade-table th:nth-child(4),
    .trade-table th:nth-child(5),
    .trade-table th:nth-child(6),
    .trade-table th:nth-child(7),
    #tradeRows tr td:nth-child(4),
    #tradeRows tr td:nth-child(5),
    #tradeRows tr td:nth-child(6),
    #tradeRows tr td:nth-child(7),
    .watch-table th:nth-child(6),
    .watch-table th:nth-child(7),
    .watch-table th:nth-child(8),
    .watch-table th:nth-child(9),
    #watchRows tr td:nth-child(6),
    #watchRows tr td:nth-child(7),
    #watchRows tr td:nth-child(8),
    #watchRows tr td:nth-child(9) {
      text-align: right;
      padding-right: 18px;
    }

    .summary-label {
      text-align: right !important;
    }

    th {
      background: #081524;
      font-weight: 600;
      font-size: 12px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .text-cell,
    .text-cell div,
    .trade-reason {
      font-size: inherit;
      font-weight: 400;
      line-height: 1.6;
      color: inherit;
    }

    .text-cell > div:first-child {
      margin-bottom: 5px;
    }

    .text-cell .meta {
      margin-top: 4px;
    }

    tbody tr {
      background: #132238;
    }

    tbody tr:nth-child(odd) {
      background: #1c2d43;
    }

    tbody tr:hover {
      background: #243954;
    }

    /* summary row */
    .summary-row td {
      font-weight: 700;
      background: #0b2d2a;
      border-top: 2px solid #00c896;
      color: #f4f7fb;
    }

    /* colors */
    .pos { color: #00c896; font-weight: 700; }
    .neg { color: #ff4d5f; font-weight: 700; }

    /* secondary line inside a merged table cell, e.g. % under a $ amount */
    .cell-sub { font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.85; }

    /* holding vs watching tags */
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .tag-held {
      background: rgba(0, 200, 150, 0.12);
      color: #00c896;
      border: 1px solid rgba(0, 200, 150, 0.22);
    }
    .tag-watch {
      background: rgba(255, 169, 20, 0.12);
      color: #ffa914;
      border: 1px solid rgba(255, 169, 20, 0.25);
    }

    /* holding row highlight */
    .row-held { background: #102b32; }
    .row-watch { background: transparent; }

    /* daily tracking cards */
    .daily-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .daily-card {
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
      background: #102034;
    }

    .daily-card .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .daily-card .ticker {
      font-weight: 700;
      font-size: 16px;
      color: #f4f7fb;
    }

    .daily-card .decision {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .decision-hold {
      background: rgba(42, 151, 255, 0.12);
      color: #2a97ff;
      border: 1px solid rgba(42, 151, 255, 0.22);
    }
    .decision-buy  {
      background: rgba(0, 200, 150, 0.12);
      color: #00c896;
      border: 1px solid rgba(0, 200, 150, 0.22);
    }
    .decision-sell {
      background: rgba(255, 77, 95, 0.12);
      color: #ff4d5f;
      border: 1px solid rgba(255, 77, 95, 0.22);
    }

    .daily-card .reason {
      font-size: 13px;
      color: #b6c4d6;
      line-height: 1.5;
    }

    .daily-card .meta {
      font-size: 12px;
      color: #8192a8;
      margin-top: 6px;
      display: flex;
      gap: 16px;
    }

    /* portfolio review */
    .review-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .review-summary {
      background: #102034;
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .review-summary-title {
      font-size: 13px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .review-summary-text {
      font-size: 15px;
      line-height: 1.55;
      color: #d7e2ef;
    }

    .review-time {
      color: #8192a8;
      font-size: 12px;
      white-space: nowrap;
    }

    .review-card {
      background: #102034;
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
      min-height: 150px;
    }

    .review-card h3 {
      font-size: 13px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .review-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .review-card li {
      font-size: 13px;
      line-height: 1.45;
      color: #d7e2ef;
      margin-bottom: 7px;
    }

    /* trade action badges in table */
    .act-buy  { color: #00c896; font-weight: 700; }
    .act-sell { color: #ff4d5f; font-weight: 700; }

    .trade-row-buy  { border-left: 3px solid #00c896; }
    .trade-row-sell { border-left: 3px solid #ff4d5f; }

    .error {
      background: rgba(255, 77, 95, 0.12);
      color: #ffd0d6;
      border: 1px solid rgba(255, 77, 95, 0.3);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }

    .note {
      font-size: 12px;
      color: #8192a8;
      margin: 12px 0 24px;
      text-align: center;
    }

        align-items: flex-start;

        padding: 14px;
        margin-bottom: 12px;
        border-radius: 8px;
      }

      .header-title {
        font-size: 15px;
        line-height: 1.25;
      }

      .header-date,
      .header-update {
        font-size: 11px;
      }

      .header-label {
        font-size: 9px;
      }

      .section {
        padding: 14px;

        border-radius: 8px;
      }

      .section h2 {
        font-size: 14px;
        margin-bottom: 12px;
        gap: 6px;
        letter-spacing: 0.4px;
      }

      .section h2 .badge {
        font-size: 10px;

      }

      .summary-cards {
        display: grid;

        margin-bottom: 12px;

      .card {
        min-width: 0;
        padding: 10px;
        border-radius: 8px;
      }

      .card .label {
        font-size: 9px;
        line-height: 1.2;
      }

      .card .value {
        font-size: 14px;

      }

      .card .sub {
        font-size: 10px;
      }

      .table-wrap {
        margin: 0 -2px;

      }

      .table-wrap::-webkit-scrollbar {

      }

      .table-wrap::-webkit-scrollbar-track {
        background: #0d1b2d;
        border-radius: 99px;
      }

      .table-wrap::-webkit-scrollbar-thumb {
        background: #3f5773;
        border-radius: 99px;
      }

      table {
        font-size: 10px !important;

      }

      th,

      th {

      }

      .text-cell,
      .text-cell div,
      .trade-reason {

        line-height: 1.45 !important;
      }

      .text-cell .meta {

      }

      .tag {

        padding: 2px 6px;
      }

      .daily-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .review-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .review-summary {
        flex-direction: column;
        padding: 10px;
        border-radius: 8px;
      }

      .review-card {
        min-height: 0;

      }

      .review-summary-text,
      .review-card li {

      }

      .review-card h3,
      .review-summary-title,
      .review-time {

      }

      .daily-card {
        padding: 10px;
        border-radius: 8px;
      }

      .daily-card .ticker {

      }

      .daily-card .reason {

      .daily-card .meta {

      }

      }

  </style>

<body>

  <!-- ====== 頂欄 ====== -->
  <div class="header-bar">
    <div class="header-left">
      <div class="header-title">xAI Grok 4.3 Portfolio Book</div>
      <div class="header-date" id="headerDate">-</div>
    </div>
    <div class="header-right">
      <div class="header-label">最後更新</div>
      <div class="header-update" id="headerUpdate">-</div>
      <div class="header-label" style="margin-top:8px;">網頁刷新</div>
      <div class="header-update" id="autoRefreshNote">-</div>
      <button id="refreshBtn" type="button" style="margin-top:8px;background:#1c2d43;color:#9caec4;border:1px solid #34465e;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">立即刷新</button>
    </div>
  </div>

  <div id="error" class="error"></div>

  <!-- ====== 1. 持倉 ====== -->
  <div class="section">
    <h2>💰 持倉 <span class="badge" id="posCount">-</span></h2>
    <div class="summary-cards" id="summaryCards"></div>
    <div class="table-wrap">
      <table class="portfolio-table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Shares</th>
            <th>Avg Cost</th>
            <th>Last Price</th>
            <th>Value</th>
            <th>PnL</th>
            <th>Stop</th>
            <th>Thesis</th>
          </tr>
        </thead>
        <tbody id="posRows"></tbody>
      </table>
    </div>
  </div>

  <!-- ====== 2. 每日追蹤 ====== -->
  <div class="section">
    <h2>📋 今日追蹤 <span class="badge" id="dailyDate">-</span></h2>
    <div class="daily-grid" id="dailyGrid"></div>
  </div>

  <!-- ====== 3. Portfolio Review ====== -->
  <div class="section">
    <h2>🧭 Portfolio Strategy Review <span class="badge" id="reviewStatus">-</span></h2>
    <div id="reviewGrid"></div>
  </div>

  <!-- ====== 4. 交易紀錄 ====== -->
  <div class="section">
    <h2>📊 交易紀錄 <span class="badge" id="tradeCount">-</span></h2>
    <div class="table-wrap">
      <table class="trade-table">
        <thead>
          <tr>
            <th>時間</th>
            <th>Ticker</th>
            <th>動作</th>
            <th>價格</th>
            <th>股數</th>
            <th>金額</th>
            <th>損益</th>
            <th>理由</th>
            <th>止損</th>
          </tr>
        </thead>
        <tbody id="tradeRows"></tbody>
      </table>
    </div>
  </div>

  <!-- ====== 5. 持續追蹤名單 ====== -->
  <div class="section">
    <h2>🔭 持續追蹤名單 <span class="badge" id="watchCount">-</span></h2>
    <div class="table-wrap">
      <table class="watch-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Ticker</th>
            <th>Name</th>
            <th>Sector</th>
            <th>First Seen</th>
            <th>Recs</th>
            <th>First Price</th>
            <th>Last Price</th>
            <th>Change</th>
            <th>Stop</th>
          </tr>
        </thead>
        <tbody id="watchRows"></tbody>
      </table>
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button id="watchToggleBtn" type="button" style="display:none;background:#1c2d43;color:#9caec4;border:1px solid #34465e;border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer;"></button>
    </div>
  </div>

  <div class="note" id="footerNote"></div>

  <script>
    const BOOK_URL  = "daily-data/xai_portfolio_book.json";
    const IDEAS_URL = "daily-data/stock_ideas_history.json";

    // ---- formatters ----
    function comma(v) {
      const parts = Number(v || 0).toFixed(2).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }
    function comma4(v) {
      const parts = Number(v || 0).toFixed(4).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }
    function money(v)  { return comma(v); }
    function num4(v)   { return comma4(v); }
    function pct2(v)   { return `${Number(v || 0).toFixed(2)}%`; }
    function cls(v)    { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
    function tagged(v) { return v > 0 ? `<span class="pos">+${money(v)}</span>`
                                    : v < 0 ? `<span class="neg">${money(v)}</span>`
                                    : `<span style="color:#8b949e">${money(0)}</span>`; }

    // ---- data loading ----
    async function loadAll() {
      const errEl = document.getElementById("error");
      try {
        // 加上時間戳避免瀏覽器/CDN 快取舊的 JSON，確保每次都拿到最新持倉價錢
        const cacheBuster = `t=${Date.now()}`;
        const bookUrl  = `${BOOK_URL}${BOOK_URL.includes("?") ? "&" : "?"}${cacheBuster}`;
        const ideasUrl = `${IDEAS_URL}${IDEAS_URL.includes("?") ? "&" : "?"}${cacheBuster}`;

        const [bookRes, ideasRes] = await Promise.all([
          fetch(bookUrl,  { cache: "no-store" }),
          fetch(ideasUrl, { cache: "no-store" }),
        ]);
        if (!bookRes.ok) throw new Error(`Portfolio HTTP ${bookRes.status}`);
        if (!ideasRes.ok) throw new Error(`Ideas HTTP ${ideasRes.status}`);

        const book  = await bookRes.json();
        const ideas = await ideasRes.json();

        renderPortfolio(book);
        renderDaily(book);
        renderReview(book);
        renderTrades(book);
        renderWatchlist(ideas, book);
        errEl.style.display = "none";
        document.getElementById("footerNote").textContent =
          `資料來源：daily-data/xai_portfolio_book.json`;
        // 頂欄日期與更新時間
        const now = new Date();
        document.getElementById("headerDate").textContent =
          `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
        document.getElementById("headerUpdate").textContent =
          book.last_updated_at || "?";
        document.getElementById("autoRefreshNote").textContent =
          `${now.toLocaleTimeString("zh-HK", { hour12: false })}`;
      } catch (err) {
        errEl.style.display = "block";
        errEl.textContent = location.protocol === "file:"
          ? "請用本地 server 開啟（python3 -m http.server 8000），否則瀏覽器會擋住 JSON 載入。"
          : `載入失敗：${err.message}`;
      }
    }

    // ================================================================
    // 1. 持倉 + 加總
    // ================================================================
    function renderPortfolio(book) {
      const positions = Object.values(book.positions || {});
      document.getElementById("posCount").textContent = `${positions.length} 檔`;

      let totalInvested = 0, totalValue = 0;
      const rows = positions.map(p => {
        const value    = (p.shares || 0) * (p.last_price || 0);
        const invested = p.invested || 0;
        const pnl      = value - invested;
        const ret      = invested ? (pnl / invested) * 100 : 0;
        totalInvested += invested;
        totalValue    += value;
        return { ...p, value, invested, pnl, ret };
      });

      const totalPnl = totalValue - totalInvested;
      const totalRet = totalInvested ? (totalPnl / totalInvested) * 100 : 0;
      const cash     = book.cash || 0;
      const equity   = totalValue + cash;
      const initCap  = book.initial_capital || 0;
      const assetPnl = equity - initCap;
      const assetRet = initCap ? (assetPnl / initCap) * 100 : 0;

      document.getElementById("summaryCards").innerHTML = `
        <div class="card">
          <div class="label">初始資金</div>
          <div class="value">$${money(initCap)}</div>
        </div>
        <div class="card">
          <div class="label">持倉市值</div>
          <div class="value">$${money(totalValue)}</div>
        </div>
        <div class="card">
          <div class="label">現金</div>
          <div class="value">$${money(cash)}</div>
        </div>
        <div class="card">
          <div class="label">總資產</div>
          <div class="value">$${money(equity)}</div>
        </div>
        <div class="card">
          <div class="label">總回報</div>
          <div class="value" style="font-size:20px;color:${assetPnl > 0 ? "#00c896" : assetPnl < 0 ? "#ff4d5f" : "#f4f7fb"}">${tagged(assetPnl)} (${pct2(assetRet)})</div>
        </div>
      `;

      document.getElementById("posRows").innerHTML =
        rows.map(r => `
          <tr>
            <td><strong>${r.ticker}</strong></td>
            <td>${num4(r.shares)}</td>
            <td>$${money(r.avg_cost)}</td>
            <td>$${money(r.last_price)}</td>
            <td>$${money(r.value)}</td>
            <td class="${cls(r.pnl)}">
              <div>${tagged(r.pnl)}</div>
              <div class="cell-sub ${cls(r.ret)}">(${pct2(r.ret)})</div>
            </td>
            <td>${r.stop || "-"}</td>
            <td class="text-cell">
              <div>${r.thesis || r.reason || r.last_reason || "-"}</div>
              ${r.review_trigger ? `<div class="meta">Review: ${r.review_trigger}</div>` : ""}
              ${Array.isArray(r.falsification_points) && r.falsification_points.length
                ? `<div class="meta">失效條件: ${r.falsification_points.slice(0, 2).join("；")}</div>`
                : ""}
            </td>
          </tr>
        `).join("")
        + `
        <tr class="summary-row">
          <td></td>
          <td></td>
          <td></td>
          <td class="summary-label"><strong>持倉總計</strong></td>
          <td>$${money(totalValue)}</td>
          <td class="${cls(totalPnl)}">
            <div>${tagged(totalPnl)}</div>
            <div class="cell-sub ${cls(totalRet)}">(${pct2(totalRet)})</div>
          </td>
          <td colspan="2"></td>
        </tr>`;
    }

    // ================================================================
    // 2. 每日追蹤（trade_log 最新日期，每 ticker 取最後一筆）
    // ================================================================
    function renderDaily(book) {
      const log = book.trade_log || [];
      if (!log.length) {
        document.getElementById("dailyGrid").innerHTML =
          '<div style="color:#6e7681;">尚無追蹤記錄</div>';
        return;
      }

      const latestDate = log[log.length - 1].time?.slice(0, 10) || "";
      document.getElementById("dailyDate").textContent = latestDate;

      const todayLog = log.filter(e => (e.time || "").startsWith(latestDate));
      const seen = new Map();
      todayLog.forEach(e => seen.set(e.ticker, e));

      const entries = [...seen.values()];
      if (!entries.length) {
        document.getElementById("dailyGrid").innerHTML =
          '<div style="color:#6e7681;">今日尚無記錄</div>';
        return;
      }

      document.getElementById("dailyGrid").innerHTML = entries.map(e => {
        const decLabel = { buy: "買入", sell: "賣出", hold: "持有" }[e.action] || e.action;
        const isSell = e.action === "sell";
        const pnlValue = isSell ? (e.pnl || 0) : (e.unrealized_pnl || 0);
        const invested = isSell ? (e.invested || 0) : ((e.value || 0) - (e.unrealized_pnl || 0));
        const pnlPct = invested ? (pnlValue / invested) * 100 : 0;
        return `
          <div class="daily-card">
            <div class="card-head">
              <span class="ticker">${e.ticker}</span>
              <span class="decision decision-${e.action}">${decLabel}</span>
            </div>
            <div class="reason">${e.reason || "-"}</div>
            <div class="meta">
              <span>價格 $${money(e.price)}</span>
              <span>${isSell ? "已實現" : "PnL"} ${tagged(pnlValue)} <span class="${cls(pnlPct)}">(${pct2(pnlPct)})</span></span>
              ${e.stop ? `<span>止損 ${e.stop}</span>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    // ================================================================
    // 3. Portfolio Review
    // ================================================================
    function renderReview(book) {
      const entry = book.latest_review || {};
      const review = entry.review || {};
      const status = review.strategy_health || "-";
      document.getElementById("reviewStatus").textContent = status;

      if (!review.summary) {
        document.getElementById("reviewGrid").innerHTML =
          '<div style="color:#6e7681;">尚無 portfolio review</div>';
        return;
      }

      const block = (title, items) => {
        const list = Array.isArray(items) ? items.slice(0, 3) : [];
        return `
          <div class="review-card">
            <h3>${title}</h3>
            ${list.length
              ? `<ul>${list.map(x => `<li>${x}</li>`).join("")}</ul>`
              : `<div style="color:#8192a8;font-size:13px;">-</div>`}
          </div>
        `;
      };

      document.getElementById("reviewGrid").innerHTML = `
        <div class="review-summary">
          <div>
            <div class="review-summary-title">Strategy Summary</div>
            <div class="review-summary-text">${review.summary || "-"}</div>
          </div>
          <div class="review-time">${entry.time || entry.date || ""}</div>
        </div>
        <div class="review-grid">
          ${block("有效地方", review.what_worked)}
          ${block("問題 / 風險", review.mistakes_or_risks)}
          ${block("下次優化", review.next_improvements)}
          ${block("風險備註", review.risk_notes)}
        </div>
      `;
    }

    // ================================================================
    // 4. 交易紀錄（只顯示 buy / sell，不含 hold）
    // ================================================================
    function renderTrades(book) {
      const log = book.trade_log || [];

      // 只取實際買賣
      const trades = log.filter(e => e.action === "buy" || e.action === "sell");

      document.getElementById("tradeCount").textContent = `${trades.length} 筆`;

      if (!trades.length) {
        document.getElementById("tradeRows").innerHTML =
          '<tr><td colspan="9" style="color:#6e7681;text-align:center;">尚無交易紀錄</td></tr>';
        return;
      }

      // 新的在前
      trades.sort((a, b) => (b.time || "").localeCompare(a.time || ""));

      const actLabel = { buy: "買入", sell: "賣出" };

      document.getElementById("tradeRows").innerHTML = trades.map(t => {
        const pnlPct = t.action === "sell" && t.invested ? (t.pnl / t.invested) * 100 : 0;
        return `
        <tr class="trade-row-${t.action}">
          <td style="color:#8b949e;">${t.time || "-"}</td>
          <td><strong>${t.ticker}</strong></td>
          <td class="act-${t.action}">${actLabel[t.action] || t.action}</td>
          <td>$${money(t.price)}</td>
          <td>${num4(t.shares)}</td>
          <td>$${money(t.amount)}</td>
          <td>${t.action === "sell"
            ? `${tagged(t.pnl || 0)} <span class="${cls(pnlPct)}">(${pct2(pnlPct)})</span>`
            : "-"}</td>
          <td class="trade-reason">${t.decision_logic || t.reason || "-"}</td>
          <td>${t.stop || "-"}</td>
        </tr>
      `;
      }).join("");
    }

    // ================================================================
    // 4. 持續追蹤名單
    // ================================================================
    let watchExpanded = false;
    const WATCH_COLLAPSE_COUNT = 8;

    function renderWatchlist(ideas, book) {
      const items = Object.values(ideas || {});
      const toggleBtn = document.getElementById("watchToggleBtn");
      if (!items.length) {
        document.getElementById("watchRows").innerHTML =
          '<tr><td colspan="10" style="color:#6e7681;text-align:center;">尚無追蹤名單</td></tr>';
        toggleBtn.style.display = "none";
        return;
      }

      document.getElementById("watchCount").textContent = `${items.length} 檔`;

      const heldTickers = new Set(
        Object.values(book.positions || {}).map(p => p.ticker)
      );

      items.sort((a, b) => (b.recommend_count || 0) - (a.recommend_count || 0));

      const hasMore = items.length > WATCH_COLLAPSE_COUNT;
      const visibleItems = (watchExpanded || !hasMore) ? items : items.slice(0, WATCH_COLLAPSE_COUNT);

      document.getElementById("watchRows").innerHTML = visibleItems.map(it => {
        const isHeld    = heldTickers.has(it.ticker);
        const statusTag = isHeld
          ? '<span class="tag tag-held">已持倉</span>'
          : '<span class="tag tag-watch">觀察中</span>';
        const rowClass  = isHeld ? "row-held" : "row-watch";

        const firstPx = it.first_price ?? null;
        const lastPx  = it.last_price ?? null;
        const chg     = (firstPx && lastPx) ? ((lastPx - firstPx) / firstPx * 100) : null;

        return `
          <tr class="${rowClass}">
            <td>${statusTag}</td>
            <td><strong>${it.ticker}</strong></td>
            <td>${it.name || "-"}</td>
            <td>${it.sector || "-"}</td>
            <td>${(it.first_recommended_at || "").slice(0, 10)}</td>
            <td>${it.recommend_count ?? "-"}</td>
            <td>${firstPx ? "$"+money(firstPx) : "-"}</td>
            <td>${lastPx  ? "$"+money(lastPx)  : "-"}</td>
            <td class="${cls(chg || 0)}">${chg !== null ? pct2(chg) : "-"}</td>
            <td>${it.stop || "-"}</td>
          </tr>
        `;
      }).join("");

      if (hasMore) {
        toggleBtn.style.display = "inline-block";
        toggleBtn.textContent = watchExpanded
          ? "收起列表 ▲"
          : `顯示全部 ${items.length} 檔 ▼`;
        toggleBtn.onclick = () => {
          watchExpanded = !watchExpanded;
          renderWatchlist(ideas, book);
        };
      } else {
        toggleBtn.style.display = "none";
      }
    }

    // ---- 自動刷新：每 60 秒重新讀取一次 daily-data JSON，持倉價錢/損益會自動更新 ----
    const REFRESH_INTERVAL_MS = 60_000;
    let refreshTimer = null;

    function scheduleAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(loadAll, REFRESH_INTERVAL_MS);
    }

    document.getElementById("refreshBtn").addEventListener("click", () => {
      loadAll();
      scheduleAutoRefresh(); // 手動刷新後重新計時，避免緊接著又自動刷新一次
    });

    // 分頁切回前景時立即刷新一次，避免背景分頁長時間顯示過期價錢
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadAll();
    });

    loadAll();
    scheduleAutoRefresh();
  </script>
</body>
</html>
