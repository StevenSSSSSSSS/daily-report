<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xAI Grok 4.3 Portfolio Book</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e5edf7;
    }

    /* ---- header bar ---- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #17263a;
      border: 1px solid #34465e;
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    .header-title {
      font-size: 22px;
      font-weight: 200;
      color: #f4f7fb;
      margin-bottom: 4px;
    }

    .header-date {
      font-size: 13px;
      color: #9caec4;
    }

    .header-right {
      text-align: right;
    }

    .header-label {
      font-size: 11px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .header-update {
      font-size: 13px;
      color: #00c896;
    }

    .section {
      background: #17263a;
      border: 1px solid #34465e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    .section h2 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1.0px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f4f7fb;
    }

    .section h2 .badge {
      font-size: 12px;
      font-weight: 100;
      letter-spacing: 1.0px;
      padding: 2px 8px;
      border-radius: 6px;
      background: #0d1b2d;
      color: #9caec4;
      border: 1px solid #2b3d55;
    }

    /* ---- summary cards ---- */
    .summary-cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      min-width: 140px;
      background: #102034;
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .card .label {
      font-size: 12px;
      color: #9caec4;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card .value {
      font-size: 22px;
      font-weight: 700;
      color: #f4f7fb;
    }

    .card .sub {
      font-size: 13px;
      color: #9caec4;
      margin-top: 2px;
    }

    /* ---- table ---- */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #27394f;
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background: #081524;
      font-weight: 600;
      font-size: 12px;
      color: #9caec4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr {
      background: #132238;
    }

    tbody tr:nth-child(odd) {
      background: #1c2d43;
    }

    tbody tr:hover {
      background: #243954;
    }

    /* summary row */
    .summary-row td {
      font-weight: 700;
      background: #0b2d2a;
      border-top: 2px solid #00c896;
      color: #f4f7fb;
    }

    /* colors */
    .pos { color: #00c896; font-weight: 700; }
    .neg { color: #ff4d5f; font-weight: 700; }

    /* holding vs watching tags */
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .tag-held {
      background: rgba(0, 200, 150, 0.12);
      color: #00c896;
      border: 1px solid rgba(0, 200, 150, 0.22);
    }
    .tag-watch {
      background: rgba(255, 169, 20, 0.12);
      color: #ffa914;
      border: 1px solid rgba(255, 169, 20, 0.25);
    }

    /* holding row highlight */
    .row-held { background: #102b32; }
    .row-watch { background: transparent; }

    /* daily tracking cards */
    .daily-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .daily-card {
      border: 1px solid #33465f;
      border-radius: 10px;
      padding: 14px 16px;
      background: #102034;
    }

    .daily-card .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .daily-card .ticker {
      font-weight: 700;
      font-size: 16px;
      color: #f4f7fb;
    }

    .daily-card .decision {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .decision-hold {
      background: rgba(42, 151, 255, 0.12);
      color: #2a97ff;
      border: 1px solid rgba(42, 151, 255, 0.22);
    }
    .decision-buy  {
      background: rgba(0, 200, 150, 0.12);
      color: #00c896;
      border: 1px solid rgba(0, 200, 150, 0.22);
    }
    .decision-sell {
      background: rgba(255, 77, 95, 0.12);
      color: #ff4d5f;
      border: 1px solid rgba(255, 77, 95, 0.22);
    }

    .daily-card .reason {
      font-size: 13px;
      color: #b6c4d6;
      line-height: 1.5;
    }

    .daily-card .meta {
      font-size: 12px;
      color: #8192a8;
      margin-top: 6px;
      display: flex;
      gap: 16px;
    }

    /* trade action badges in table */
    .act-buy  { color: #00c896; font-weight: 300; }
    .act-sell { color: #ff4d5f; font-weight: 300; }

    .trade-row-buy  { border-left: 3px solid #00c896; }
    .trade-row-sell { border-left: 3px solid #ff4d5f; }

    .error {
      background: rgba(255, 77, 95, 0.12);
      color: #ffd0d6;
      border: 1px solid rgba(255, 77, 95, 0.3);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }

    .note {
      font-size: 12px;
      color: #8192a8;
      margin: 12px 0 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ====== 頂欄 ====== -->
  <div class="header-bar">
    <div class="header-left">
      <div class="header-title">xAI Grok 4.3 Portfolio Book</div>
      <div class="header-date" id="headerDate">-</div>
    </div>
    <div class="header-right">
      <div class="header-label">最後更新</div>
      <div class="header-update" id="headerUpdate">-</div>
    </div>
  </div>

  <div id="error" class="error"></div>

  <!-- ====== 1. 持倉 ====== -->
  <div class="section">
    <h2>💰 持倉 <span class="badge" id="posCount">-</span></h2>
    <div class="summary-cards" id="summaryCards"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Shares</th>
            <th>Avg Cost</th>
            <th>Last Price</th>
            <th>Value</th>
            <th>PnL</th>
            <th>Return</th>
            <th>Stop</th>
            <th>Thesis</th>
          </tr>
        </thead>
        <tbody id="posRows"></tbody>
      </table>
    </div>
  </div>

  <!-- ====== 2. 每日追蹤 ====== -->
  <div class="section">
    <h2>📋 今日追蹤 <span class="badge" id="dailyDate">-</span></h2>
    <div class="daily-grid" id="dailyGrid"></div>
  </div>

  <!-- ====== 3. 交易紀錄 ====== -->
  <div class="section">
    <h2>📊 交易紀錄 <span class="badge" id="tradeCount">-</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>時間</th>
            <th>Ticker</th>
            <th>動作</th>
            <th>價格</th>
            <th>股數</th>
            <th>金額</th>
            <th>剩餘現金</th>
            <th>理由</th>
            <th>止損</th>
          </tr>
        </thead>
        <tbody id="tradeRows"></tbody>
      </table>
    </div>
  </div>

  <!-- ====== 4. 持續追蹤名單 ====== -->
  <div class="section">
    <h2>🔭 持續追蹤名單 <span class="badge" id="watchCount">-</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Ticker</th>
            <th>Name</th>
            <th>Sector</th>
            <th>First Seen</th>
            <th>Recs</th>
            <th>First Price</th>
            <th>Last Price</th>
            <th>Change</th>
            <th>Stop</th>
          </tr>
        </thead>
        <tbody id="watchRows"></tbody>
      </table>
    </div>
  </div>

  <div class="note" id="footerNote"></div>

  <script>
    const BOOK_URL  = "daily-data/xai_portfolio_book.json";
    const IDEAS_URL = "daily-data/stock_ideas_history.json";

    // ---- formatters ----
    function comma(v) {
      const parts = Number(v || 0).toFixed(2).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }
    function comma4(v) {
      const parts = Number(v || 0).toFixed(4).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }
    function money(v)  { return comma(v); }
    function num4(v)   { return comma4(v); }
    function pct2(v)   { return `${Number(v || 0).toFixed(2)}%`; }
    function cls(v)    { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
    function tagged(v) { return v > 0 ? `<span class="pos">+${money(v)}</span>`
                                    : v < 0 ? `<span class="neg">${money(v)}</span>`
                                    : `<span style="color:#8b949e">${money(0)}</span>`; }

    // ---- data loading ----
    async function loadAll() {
      const errEl = document.getElementById("error");
      try {
        const [bookRes, ideasRes] = await Promise.all([
          fetch(BOOK_URL), fetch(IDEAS_URL)
        ]);
        if (!bookRes.ok) throw new Error(`Portfolio HTTP ${bookRes.status}`);
        if (!ideasRes.ok) throw new Error(`Ideas HTTP ${ideasRes.status}`);

        const book  = await bookRes.json();
        const ideas = await ideasRes.json();

        renderPortfolio(book);
        renderDaily(book);
        renderTrades(book);
        renderWatchlist(ideas, book);
        document.getElementById("footerNote").textContent =
          `資料來源：daily-data/xai_portfolio_book.json`;
        // 頂欄日期與更新時間
        const now = new Date();
        document.getElementById("headerDate").textContent =
          `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
        document.getElementById("headerUpdate").textContent =
          book.last_updated_at || "?";
      } catch (err) {
        errEl.style.display = "block";
        errEl.textContent = location.protocol === "file:"
          ? "請用本地 server 開啟（python3 -m http.server 8000），否則瀏覽器會擋住 JSON 載入。"
          : `載入失敗：${err.message}`;
      }
    }

    // ================================================================
    // 1. 持倉 + 加總
    // ================================================================
    function renderPortfolio(book) {
      const positions = Object.values(book.positions || {});
      document.getElementById("posCount").textContent = `${positions.length} 檔`;

      let totalInvested = 0, totalValue = 0;
      const rows = positions.map(p => {
        const value    = (p.shares || 0) * (p.last_price || 0);
        const invested = p.invested || 0;
        const pnl      = value - invested;
        const ret      = invested ? (pnl / invested) * 100 : 0;
        totalInvested += invested;
        totalValue    += value;
        return { ...p, value, invested, pnl, ret };
      });

      const totalPnl = totalValue - totalInvested;
      const totalRet = totalInvested ? (totalPnl / totalInvested) * 100 : 0;
      const cash     = book.cash || 0;
      const equity   = totalValue + cash;
      const initCap  = book.initial_capital || 0;

      document.getElementById("summaryCards").innerHTML = `
        <div class="card">
          <div class="label">初始資金</div>
          <div class="value">$${money(initCap)}</div>
        </div>
        <div class="card">
          <div class="label">持倉市值</div>
          <div class="value">$${money(totalValue)}</div>
        </div>
        <div class="card">
          <div class="label">現金</div>
          <div class="value">$${money(cash)}</div>
        </div>
        <div class="card">
          <div class="label">總資產</div>
          <div class="value">$${money(equity)}</div>
          <div class="sub ${cls(totalPnl)}">${tagged(totalPnl)}</div>
        </div>
        <div class="card">
          <div class="label">總回報</div>
          <div class="value ${cls(totalRet)}">${pct2(totalRet)}</div>
          <div class="sub ${cls(totalPnl)}">${tagged(totalPnl)}</div>
        </div>
      `;

      document.getElementById("posRows").innerHTML =
        rows.map(r => `
          <tr>
            <td><strong>${r.ticker}</strong></td>
            <td>${num4(r.shares)}</td>
            <td>$${money(r.avg_cost)}</td>
            <td>$${money(r.last_price)}</td>
            <td>$${money(r.value)}</td>
            <td class="${cls(r.pnl)}">${tagged(r.pnl)}</td>
            <td class="${cls(r.ret)}">${pct2(r.ret)}</td>
            <td>${r.stop || "-"}</td>
            <td style="max-width:220px;white-space:normal;font-size:13px;">${r.last_reason || "-"}</td>
          </tr>
        `).join("")
        + `
        <tr class="summary-row">
          <td><strong>總計</strong></td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>$${money(totalValue)}</td>
          <td class="${cls(totalPnl)}">${tagged(totalPnl)}</td>
          <td class="${cls(totalRet)}">${pct2(totalRet)}</td>
          <td colspan="2">-</td>
        </tr>`;
    }

    // ================================================================
    // 2. 每日追蹤（trade_log 最新日期，每 ticker 取最後一筆）
    // ================================================================
    function renderDaily(book) {
      const log = book.trade_log || [];
      if (!log.length) {
        document.getElementById("dailyGrid").innerHTML =
          '<div style="color:#6e7681;">尚無追蹤記錄</div>';
        return;
      }

      const latestDate = log[log.length - 1].time?.slice(0, 10) || "";
      document.getElementById("dailyDate").textContent = latestDate;

      const todayLog = log.filter(e => (e.time || "").startsWith(latestDate));
      const seen = new Map();
      todayLog.forEach(e => seen.set(e.ticker, e));

      const entries = [...seen.values()];
      if (!entries.length) {
        document.getElementById("dailyGrid").innerHTML =
          '<div style="color:#6e7681;">今日尚無記錄</div>';
        return;
      }

      document.getElementById("dailyGrid").innerHTML = entries.map(e => {
        const decLabel = { buy: "買入", sell: "賣出", hold: "持有" }[e.action] || e.action;
        return `
          <div class="daily-card">
            <div class="card-head">
              <span class="ticker">${e.ticker}</span>
              <span class="decision decision-${e.action}">${decLabel}</span>
            </div>
            <div class="reason">${e.reason || "-"}</div>
            <div class="meta">
              <span>價格 $${money(e.price)}</span>
              <span>PnL ${tagged(e.unrealized_pnl || 0)}</span>
              ${e.stop ? `<span>止損 ${e.stop}</span>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    // ================================================================
    // 3. 交易紀錄（只顯示 buy / sell，不含 hold）
    // ================================================================
    function renderTrades(book) {
      const log = book.trade_log || [];

      // 只取實際買賣
      const trades = log.filter(e => e.action === "buy" || e.action === "sell");

      document.getElementById("tradeCount").textContent = `${trades.length} 筆`;

      if (!trades.length) {
        document.getElementById("tradeRows").innerHTML =
          '<tr><td colspan="9" style="color:#6e7681;text-align:center;">尚無交易紀錄</td></tr>';
        return;
      }

      // 新的在前
      trades.sort((a, b) => (b.time || "").localeCompare(a.time || ""));

      const actLabel = { buy: "買入", sell: "賣出" };

      document.getElementById("tradeRows").innerHTML = trades.map(t => `
        <tr class="trade-row-${t.action}">
          <td style="color:#8b949e;">${t.time || "-"}</td>
          <td><strong>${t.ticker}</strong></td>
          <td class="act-${t.action}">${actLabel[t.action] || t.action}</td>
          <td>$${money(t.price)}</td>
          <td>${num4(t.shares)}</td>
          <td>$${money(t.amount)}</td>
          <td>$${money(t.cash_after)}</td>
          <td style="max-width:240px;white-space:normal;font-size:13px;">${t.reason || "-"}</td>
          <td>${t.stop || "-"}</td>
        </tr>
      `).join("");
    }

    // ================================================================
    // 4. 持續追蹤名單
    // ================================================================
    function renderWatchlist(ideas, book) {
      const items = Object.values(ideas || {});
      if (!items.length) {
        document.getElementById("watchRows").innerHTML =
          '<tr><td colspan="10" style="color:#6e7681;text-align:center;">尚無追蹤名單</td></tr>';
        return;
      }

      document.getElementById("watchCount").textContent = `${items.length} 檔`;

      const heldTickers = new Set(
        Object.values(book.positions || {}).map(p => p.ticker)
      );

      items.sort((a, b) => (b.recommend_count || 0) - (a.recommend_count || 0));

      document.getElementById("watchRows").innerHTML = items.map(it => {
        const isHeld    = heldTickers.has(it.ticker);
        const statusTag = isHeld
          ? '<span class="tag tag-held">已持倉</span>'
          : '<span class="tag tag-watch">觀察中</span>';
        const rowClass  = isHeld ? "row-held" : "row-watch";

        const firstPx = it.first_price ?? null;
        const lastPx  = it.last_price ?? null;
        const chg     = (firstPx && lastPx) ? ((lastPx - firstPx) / firstPx * 100) : null;

        return `
          <tr class="${rowClass}">
            <td>${statusTag}</td>
            <td><strong>${it.ticker}</strong></td>
            <td>${it.name || "-"}</td>
            <td>${it.sector || "-"}</td>
            <td>${(it.first_recommended_at || "").slice(0, 10)}</td>
            <td>${it.recommend_count ?? "-"}</td>
            <td>${firstPx ? "$"+money(firstPx) : "-"}</td>
            <td>${lastPx  ? "$"+money(lastPx)  : "-"}</td>
            <td class="${cls(chg || 0)}">${chg !== null ? pct2(chg) : "-"}</td>
            <td>${it.stop || "-"}</td>
          </tr>
        `;
      }).join("");
    }

    loadAll();
  </script>
</body>
</html>
